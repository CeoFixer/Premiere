<dialog class="media-dialog" id="trailer-dialog" aria-label="La Plage — trailer" data-trailer-dialog data-kind="{{trailerKind}}" data-sources="{{trailerSources}}">
    <button class="dialog-close" type="button" aria-label="Close trailer" data-dialog-close>
      <svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6L19 6.4 17.6 5 12 10.6z"/></svg>
    </button>
    <div class="media-frame" data-trailer-frame></div>
  </dialog>
  <dialog class="media-dialog lightbox" id="lightbox" aria-label="Image viewer" data-lightbox-dialog>
    <button class="dialog-close" type="button" aria-label="Close" data-dialog-close>
      <svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6L19 6.4 17.6 5 12 10.6z"/></svg>
    </button>
    <button class="lightbox-nav prev" type="button" aria-label="Previous image" data-lightbox-prev>
      <svg aria-hidden="true" viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M15.4 5.4 14 4l-8 8 8 8 1.4-1.4L8.8 12z"/></svg>
    </button>
    <img alt="" data-lightbox-img>
    <button class="lightbox-nav next" type="button" aria-label="Next image" data-lightbox-next>
      <svg aria-hidden="true" viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M8.6 5.4 10 4l8 8-8 8-1.4-1.4 6.6-6.6z"/></svg>
    </button>
  </dialog>
